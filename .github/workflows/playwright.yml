name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Política de resultado (detalhes no README, seção "Limitações conhecidas da suíte"):
# - Bugs conhecidos são marcados explicitamente nos testes ([BUGxx] no Postman, describe "Bugs conhecidos" no Playwright).
# - Qualquer falha fora dessa lista, ou um bug conhecido que passe a se comportar diferente, deixa o pipeline vermelho.
# - Nenhum passo usa continue-on-error.

jobs:
  gherkin:
    name: Cenários (Gherkin)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint:gherkin

  ui:
    name: Interface (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  api:
    name: API (Postman/Newman)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # scripts/api.mjs cria reports/, roda a collection e só aprova se as únicas falhas forem as dos bugs abertos.
      - run: npm run test:api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report
          path: reports/
          if-no-files-found: error
          retention-days: 14

  ct16:
    name: API · CT16 (Playwright, seed fixa)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Seed fixa (padrão do teste): o resultado do PR é determinístico.
      - run: npm run test:ct16
